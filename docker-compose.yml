version: '3.8'

services:
  # Laravel App FPM Server
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: paowazay-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - paowazay-network

  # Queue Worker
  queue:
    image: paowazay-app
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
    networks:
      - paowazay-network

  # Nginx Reverse Proxy
  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - paowazay-network

  # MySQL Database Server
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: paowazay
      MYSQL_USER: paowazay_user
      MYSQL_PASSWORD: secret_password
      MYSQL_ROOT_PASSWORD: root_secret_password
    volumes:
      - paowazay-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_secret_password"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - paowazay-network

  # Redis Cache & Queue Backend
  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - paowazay-redis-data:/data
    networks:
      - paowazay-network

networks:
  paowazay-network:
    driver: bridge

volumes:
  paowazay-db-data:
    driver: local
  paowazay-redis-data:
    driver: local
